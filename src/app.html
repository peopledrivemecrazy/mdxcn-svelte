<!doctype html>
<html lang="en" data-accent="ocean" data-accent-kind="gradient">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(function () {
				var root = document.documentElement;
				try {
					var theme = localStorage.getItem('theme');
					var dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
					root.classList.toggle('dark', dark);
					var ids = {
						theme: 'solid',
						mint: 'solid',
						orange: 'solid',
						green: 'solid',
						cyan: 'solid',
						blue: 'solid',
						purple: 'solid',
						pink: 'solid',
						sunset: 'gradient',
						ocean: 'gradient',
						neon: 'gradient',
						aurora: 'gradient',
						fire: 'gradient',
						prism: 'gradient'
					};
					var accent = localStorage.getItem('graph-accent');
					if (ids[accent]) {
						root.setAttribute('data-accent', accent);
						root.setAttribute('data-accent-kind', ids[accent]);
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
